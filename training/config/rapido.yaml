behaviors:
  GangFightFighterV4:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 5000
    checkpoint_interval: 100000
    keep_checkpoints: 5
    threaded: false

engine_settings:
  time_scale: 100
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 0
torch_settings:
  device: cpu
